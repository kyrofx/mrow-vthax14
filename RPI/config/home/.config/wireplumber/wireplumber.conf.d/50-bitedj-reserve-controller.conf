# Keep PipeWire off the DJ controller.
#
# BiteDJ opens the controller directly as an ALSA hw: device, via PortAudio, to
# get low latency and all four output channels (Master 1-2, Headphones 3-4).
# PipeWire otherwise claims the same card at boot and holds it through the D-Bus
# device-reservation protocol -- which PortAudio does not speak, so BiteDJ simply
# cannot open it and the controller stays silent with no useful error.
#
# Disabling the device here means PipeWire never creates it, so the card belongs
# to BiteDJ from boot. Built-in audio, HDMI and Bluetooth are untouched and still
# go through PipeWire as normal.
#
# To undo: delete this file and `systemctl --user restart wireplumber`.

monitor.alsa.rules = [
  {
    matches = [
      # This exact unit (device.name embeds the USB serial), and any DDJ-FLX4 --
      # match entries are OR'd, so a replacement controller is still covered.
      { device.name = "alsa_card.usb-AlphaTheta_Corporation_DDJ-FLX4_FBMP034632NN-00" }
      { api.alsa.card.name = "DDJ-FLX4" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
