# Never idle-suspend a Bluetooth sink.
#
# WirePlumber's suspend-node.lua suspends a node after 5s idle
# (session.suspend-timeout-seconds, default 5). For a Bluetooth sink that
# releases the A2DP transport -- bluez5.profile drops to "off" -- while any
# stream feeding it stays linked and apparently healthy.
#
# BiteDJ holds its Booth output open from startup whether or not a deck is
# playing, so between sets the node goes idle, the transport is released, and
# the resume when playback restarts is not reliable over Bluetooth. The result
# is the worst kind of failure: wpctl shows the sink connected and the stream
# linked and active, pw-top shows zero errors, and no sound comes out. The only
# hint is bluez5.profile reading "off".
#
# 0 disables the timeout, so the transport is held for as long as the speaker
# is connected. The cost is that Bluetooth stays active while idle, which on a
# DJ appliance is the right trade.
#
# To undo: delete this file and `systemctl --user restart wireplumber`.

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
