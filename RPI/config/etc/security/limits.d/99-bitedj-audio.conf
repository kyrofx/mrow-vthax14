# Real-time audio for BiteDJ. The engine pins CPUs and runs its main thread at
# RT priority; without rtprio it silently degrades to normal scheduling and
# drops out under load. memlock keeps the audio buffers off the swap path --
# this box swaps to zram, and a page fault in the engine callback is a glitch.
@audio   -   rtprio      95
@audio   -   memlock     unlimited
@audio   -   nice        -19
